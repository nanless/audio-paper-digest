name: Deploy Hugo to Pages

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  unit:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.160.1'
          extended: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Unit checks
        run: npm test

  build:
    runs-on: ubuntu-22.04
    env:
      GOMEMLIMIT: '6GiB'
      GOMAXPROCS: '4'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.160.1'
          extended: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Report build resources
        run: |
          printf 'architecture='
          uname -m
          printf 'logical_cpus='
          getconf _NPROCESSORS_ONLN
          free -h
          printf 'GOMEMLIMIT=%s\nGOMAXPROCS=%s\nHUGO_NUMWORKERMULTIPLIER=%s\n' "$GOMEMLIMIT" "$GOMAXPROCS" "${HUGO_NUMWORKERMULTIPLIER:-1}"

      - name: Build and verify
        # Keep the complete build/verification entry; only the runner allowance changes.
        # Public ubuntu-22.04 runners provide 4 CPUs and 16 GB RAM.
        run: npm run build:verify

      - name: Upload artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    if: github.event_name != 'pull_request' && needs.unit.result == 'success' && needs.build.result == 'success'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-22.04
    needs: [unit, build]
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
