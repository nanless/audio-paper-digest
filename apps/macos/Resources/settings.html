<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'self';script-src 'self';style-src 'self' 'unsafe-inline';img-src 'self' data:;connect-src 'self';object-src 'none';base-uri 'none'"><title>论文速递设置</title><link rel="stylesheet" href="styles.css"><script src="settings.js" type="module"></script><style>body{min-width:680px;height:100vh}.settings-body{height:100vh;grid-template-columns:165px minmax(0,1fr)}.settings-content{padding:34px;overflow:auto}.settings-nav{padding-top:28px}.settings-content input:not([type=checkbox]):not([type=range]),.settings-content select{width:100%;padding:7px 10px;background:var(--surface);border:1px solid var(--line);border-radius:6px}.settings-content h1{font-size:24px;margin-bottom:10px}.settings-content p{color:var(--muted);line-height:1.7;margin:12px 0}.settings-content label{display:grid;gap:6px;font-size:12px;margin:12px 0}.settings-content button{border:1px solid var(--line);margin:4px 4px 4px 0}.inline-fields{display:grid;grid-template-columns:1fr 1fr;gap:16px}.settings-nav button{width:100%;justify-content:flex-start;margin-bottom:7px;padding:8px 12px}.settings-nav button[aria-current=page]{background:var(--accent-soft)}#save-status{font-size:12px;min-height:20px}</style></head><body><div class="settings-body"><nav class="settings-nav" aria-label="设置分类"><button data-pane="reading" aria-current="page">阅读与外观</button><button data-pane="model">模型 API</button><button data-pane="zotero">Zotero 存档</button><button data-pane="storage">同步与资料</button></nav><main class="settings-content"><section data-setting-pane="reading"><h1>阅读与外观</h1><p>舒适阅读，保留论文图表的原始颜色。</p><label>外观<select id="appearance"><option value="system">跟随系统</option><option value="light">浅色</option><option value="dark">深色</option></select></label><label>正文字号 <output id="font-label">18</output><input id="font" type="range" min="16" max="24" value="18"></label><label><span>减少动态效果 <input type="checkbox" id="reduceMotion"></span></label></section><section data-setting-pane="model" hidden><h1>模型 API</h1><p>个人解析使用自己的服务。以 PDF 提取的实际文字为材料；当前不发送图片或扫描页。</p><label>API 端点<input id="endpoint" type="url" placeholder="https://api.example.com/v1"></label><div class="inline-fields"><label>模型名称<input id="model" placeholder="服务中的真实模型 ID"></label><label>请求协议<select id="protocol"><option value="auto">按模型与端点识别</option><option value="responses">OpenAI Responses</option><option value="chat">Chat Completions</option></select></label></div><div class="inline-fields"><label>最大输出 tokens<input id="maxTokens" type="number" min="256" max="32768" value="8192"></label><label>每日请求上限<input id="dailyRequests" type="number" min="1" max="1000" value="50"></label></div><p id="key-status">钥匙串状态待载入</p><button id="set-key">安全输入 API 密钥…</button><button id="delete-key">移除保存的密钥</button><button id="check-model" class="primary-button">发送最小连接测试</button><p id="model-result" role="status"></p><p>实际 token 用量随每个响应保存。服务没有返回价格时，金额显示未知；取消或中断可能已经发生消费，不自动重发。</p></section><section data-setting-pane="zotero" hidden></section><section data-setting-pane="storage" hidden><h1>同步与资料</h1><p>网站已有的导读、评分、分类直接读取，不重复分析。关闭窗口后应用继续运行；退出后不执行后台任务。</p><label>自动同步间隔（小时）<input id="syncHours" type="number" min="1" max="168" value="12"></label><label>HTTP CONNECT 代理（arXiv / Muse 必需）<input id="httpProxy" placeholder="http://127.0.0.1:端口"></label><p>代理仅使用此处明确保存的设置，不读取生产任务的环境文件。</p><button id="sync-all">同步完整目录</button><button id="backup">备份个人资料…</button><button id="restore">恢复备份…</button><button id="reveal">在 Finder 查看资料</button><button id="diagnostics">导出诊断…</button><p id="storage-result" role="status"></p></section><p id="save-status" role="status"></p><button id="discard-settings">撤销未保存更改</button></main></div><div class="toast" id="toast" role="status" hidden></div></body></html>
