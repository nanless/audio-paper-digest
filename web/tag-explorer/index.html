<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="论文历史标签的只读映射预览与分面检索；不代表正式语义重标。">
  <title>研究标签浏览 · 历史映射预览</title>
  <link rel="stylesheet" href="./style.css">
  <script src="./app.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#results-heading">跳到论文结果</a>
  <header class="site-header">
    <p class="eyebrow">AUDIO PAPER DIGEST / RESEARCH INDEX</p>
    <h1>研究标签浏览</h1>
    <p class="preview-notice"><strong>历史标签映射预览</strong> · 非正式语义重标。即使标签全部映射，也未完成逐篇论文语义核验。</p>
    <p id="dataset-meta" class="muted">正在读取本地预览索引…</p>
  </header>
  <main>
    <section id="error" class="error-panel" role="alert" hidden>
      <h2>索引未能加载</h2>
      <p id="error-message"></p>
      <button id="retry" type="button">重新加载</button>
    </section>
    <form id="filters" aria-label="论文筛选" autocomplete="off">
      <fieldset id="controls" disabled>
        <legend class="sr-only">检索与分面筛选</legend>
        <div class="search-row">
          <div class="search-field">
            <label for="search">搜索标题、原标签或中英文别名</label>
            <input id="search" type="search" placeholder="例如 ASR、LoRA、语音识别" aria-describedby="filter-help">
          </div>
          <button id="clear" type="button" class="secondary">清除筛选</button>
        </div>
        <div class="options-row">
          <label class="check-label"><input id="needs-review" type="checkbox">仅看未映射或主任务待核的记录</label>
          <label for="page-size">每页 <select id="page-size"><option value="20">20</option><option value="50">50</option></select> 条</label>
        </div>
        <p id="filter-help" class="muted">同一分面多选为“或”，不同分面为“且”。选择父节点自动包含子节点；括号内是包含子节点的记录数，不可相加。</p>
        <div class="workspace">
          <aside id="facets" aria-label="标签分面"></aside>
          <section id="results" aria-labelledby="results-heading">
            <div class="results-header">
              <h2 id="results-heading" tabindex="-1">论文结果</h2>
              <p id="result-count" role="status" aria-live="polite">正在加载…</p>
            </div>
            <p id="empty" class="empty-state" hidden></p>
            <ol id="paper-list" class="paper-list"></ol>
            <nav class="pagination" aria-label="结果分页">
              <button id="previous" type="button">上一页</button>
              <span id="page-info"></span>
              <button id="next" type="button">下一页</button>
            </nav>
          </section>
        </div>
      </fieldset>
    </form>
    <noscript><p class="error-panel">此本地预览需要 JavaScript 才能读取索引并筛选；未执行加载不代表没有论文。</p></noscript>
  </main>
  <footer>只读预览 · 原论文链接与旧标签保留 · 主任务缺失时不从首标签猜测</footer>
</body>
</html>
