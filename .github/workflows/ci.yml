name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Check JavaScript syntax
        run: |
          find scripts tests -name '*.js' -print0 | while IFS= read -r -d '' file; do
            node -c "$file"
          done

      - name: Check Python syntax
        run: |
          find scripts -name '*.py' -print0 | while IFS= read -r -d '' file; do
            PYTHONPYCACHEPREFIX=/tmp/audio-paper-digest-pycache python3 -m py_compile "$file"
          done

      - name: Check shell syntax
        run: |
          bash -n scripts/backup-data.sh
