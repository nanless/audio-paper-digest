name: CI

on:
  # Ordinary checkpoint pushes do not start the expensive acceptance suite.
  # Run once after the complete change has been reviewed and frozen.
  workflow_dispatch:
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify (${{ matrix.node-version }}, ${{ matrix.partition.label }})
    # ubuntu-latest 已在 2026-11 切到 26.04，当前 Playwright 1.60 不支持该发行版的
    # chromium，安装浏览器会直接失败。固定到 24.04 LTS，测试内容与命令不变。
    runs-on: ubuntu-24.04
    # 单个分片挂死时不要让作业占满默认的 360 分钟。
    timeout-minutes: 120
    # 模块加载时会检查正式环境变量。CI 使用无法联网的占位配置，
    # 单元测试模拟请求，不读取仓库或组织的密钥。
    env:
      PAPER_ANALYZER_ENDPOINT: https://example.invalid/v1
      PAPER_ANALYZER_API_KEY: ci-placeholder-not-a-secret
      PAPER_ANALYZER_MODEL: muse-spark-1.3-contributor
      PAPER_ANALYZER_SECONDARY_ENDPOINT: https://example.invalid/v1
      PAPER_ANALYZER_SECONDARY_API_KEY: ci-secondary-placeholder-not-a-secret
      PAPER_ANALYZER_SECONDARY_MODEL: muse-spark-1.3-contributor
    strategy:
      fail-fast: false
      matrix:
        node-version: [20.x, 22.x]
        partition:
          - { suite: javascript, shard: '1/4', label: js-1 }
          - { suite: javascript, shard: '2/4', label: js-2 }
          - { suite: javascript, shard: '3/4', label: js-3 }
          - { suite: javascript, shard: '4/4', label: js-4 }
          - { suite: python, label: python }
          - { suite: static, label: static }
        # JavaScript behavior is checked under both supported Node lines.
        # Python and static validation do not need duplicate Node runners.
        exclude:
          - node-version: 20.x
            partition: { suite: python, label: python }
          - node-version: 20.x
            partition: { suite: static, label: static }

    steps:
      - uses: actions/checkout@v4
        with:
          # 旧已付费记录只读核验需要原 Git blob，当前工作树不保存旧提示词。
          fetch-depth: 0

      - name: 配置 Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: 安装项目依赖
        run: npm ci

      - name: 配置 Python 测试环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装 Python 测试依赖
        run: |
          python3 -m pip install --disable-pip-version-check -r requirements.txt
          bash scripts/python-runtime.sh -m pip check

      - name: 安装论文图渲染所需浏览器
        run: bash scripts/python-runtime.sh -m playwright install --with-deps chromium

      - name: 安装中日韩字体
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends fonts-noto-cjk

      - name: 安装固定版本 Hugo 并核验官方校验和
        env:
          HUGO_VERSION: '0.160.1'
        run: |
          set -euo pipefail
          hugo_download_dir="$(mktemp -d)"
          archive="hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"
          release="https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}"
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            "$release/$archive" --output "$hugo_download_dir/$archive"
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            "$release/hugo_${HUGO_VERSION}_checksums.txt" --output "$hugo_download_dir/checksums.txt"
          cd "$hugo_download_dir"
          awk -v archive="$archive" '$2 == archive { print; count++ } END { if (count != 1) exit 1 }' checksums.txt > selected-checksum.txt
          sha256sum --check --strict selected-checksum.txt
          tar -xzf "$archive" hugo
          sudo install -m 0755 hugo /usr/local/bin/hugo
          hugo version

      - name: 创建独立的 CI 环境配置
        run: |
          umask 077
          printf '%s\n' \
            "PAPER_ANALYZER_ENDPOINT=$PAPER_ANALYZER_ENDPOINT" \
            "PAPER_ANALYZER_API_KEY=$PAPER_ANALYZER_API_KEY" \
            "PAPER_ANALYZER_MODEL=$PAPER_ANALYZER_MODEL" \
            "PAPER_ANALYZER_SECONDARY_ENDPOINT=$PAPER_ANALYZER_SECONDARY_ENDPOINT" \
            "PAPER_ANALYZER_SECONDARY_API_KEY=$PAPER_ANALYZER_SECONDARY_API_KEY" \
            "PAPER_ANALYZER_SECONDARY_MODEL=$PAPER_ANALYZER_SECONDARY_MODEL" \
            "PD_WORKSPACE_ALLOW_CROSS_ROLE=1" \
            "HTTPS_PROXY=http://127.0.0.1:9" > .env

      - name: 绑定并核验 CI 工作区角色
        run: |
          npm run workspace:role -- set daily
          npm run workspace:role -- status

      - name: 运行隔离的验证套件
        # data/ 不纳入版本控制，因此 CI 显式允许空数据；
        # 单元测试另行构造数据，检查正式文件的格式与对应关系。
        env:
          VERIFY_SUITE: ${{ matrix.partition.suite }}
          VERIFY_SHARD: ${{ matrix.partition.shard }}
        run: |
          set -euo pipefail
          verify_args=(--allow-empty --suite "$VERIFY_SUITE")
          if [ -n "$VERIFY_SHARD" ]; then
            verify_args+=(--shard "$VERIFY_SHARD")
          fi
          npm run verify -- "${verify_args[@]}" 2>&1 | tee verification.log

      - name: 保存逐套件验证日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-${{ matrix.node-version }}-${{ matrix.partition.label }}
          path: verification.log
          if-no-files-found: ignore

  # Keep the original two required-check names. Neither partial suite nor a
  # cancelled/missing shard can report complete verification.
  test:
    name: test (${{ matrix.node-version }})
    if: always()
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      matrix:
        node-version: [20.x, 22.x]
    steps:
      - name: 确认两版本全部分片通过
        env:
          VERIFY_RESULT: ${{ needs.verify.result }}
        run: test "$VERIFY_RESULT" = success

  # 客户端测试不进服务端分片矩阵，独立作业避免拖慢上述十二个检查：
  # Android 需要 JDK、Gradle 与 SDK，与 Node/Python 分片没有共享资源，也不并入 test 汇总检查。
  # macOS 客户端测试暂不接入 CI（见 63b9339c），仍在发行机上用 bash apps/macos/test.sh 运行。
  # macOS 的测试固定资产（公开论文 arXiv:2610.27491v1 的 PDF 与三张图）已入库，
  # 干净 checkout 能直接读取；NativeLibraryAccessibility 在无 AX 窗口的环境以 77
  # 退出，test.sh 只把 77 记为跳过，其它非零仍失败。
  # client-android 只运行仓库里已有的客户端测试入口，并已在 GitHub Actions 上运行通过。
  client-android:
    name: client (android)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: 配置 Android SDK
        # ubuntu-24.04 运行器已预装 Android SDK；setup-android 在当前 runner 上
        # 调 sdkmanager 安装 tools 会失败。这里直接复用预装目录并接受许可，
        # 缺失的平台与构建工具由 Gradle 按项目声明下载。
        run: |
          set -euo pipefail
          sdk=/usr/local/lib/android/sdk
          cli="$(ls -d "$sdk"/cmdline-tools/*/bin 2>/dev/null | sort -V | tail -1)"
          echo "ANDROID_HOME=$sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$sdk" >> "$GITHUB_ENV"
          if [ -n "$cli" ]; then
            yes | "$cli/sdkmanager" --licenses >/dev/null 2>&1 || true
          fi

      - name: 安装项目依赖
        run: npm ci

      - name: 安装 katex（Gradle 资产步骤依赖）
        # 根目录没有 npm workspaces。:app:testDebugUnitTest 的任务图包含
        # :app:prepareDebugPublishedAssets，它无条件从 apps/macos/node_modules/katex
        # 复制文件；只跑根 npm ci 会在干净 checkout 上 ENOENT。
        working-directory: apps/macos
        run: npm ci

      - name: 运行 Android 客户端单元测试
        # 不运行 apps/android/test.sh：除 :app:testDebugUnitTest 外，它还会构建、
        # lint 并运行整套发行/签名检查；本作业只覆盖 Gradle 单元测试。
        # 单元测试会读取打包后的已发布样本，因此保留资产准备任务；样本资产已入库，
        # katex 依赖已在上一阶段安装。
        working-directory: apps/android
        run: ./gradlew :app:testDebugUnitTest --no-daemon

  # macOS 客户端测试暂不接入 CI：本机 `bash apps/macos/test.sh` 全绿（57 个 Swift
  # 套件与全部 node/python 段），但 GitHub 的 macos-15 runner 有两处环境敏感断言：
  # 虚拟显示器会压缩 820x700 的 native 详情窗口，PDFKit 对混合文字/空白页的文本
  # 提取结果与本机不同（DesktopNativeTests 的 mixed text/blank PDF 用例）。
  # 这两项是 runner 环境差异，不是功能回归；需要专门适配 runner 后再加回作业，
  # 不能用跳过套件的方式让作业变绿。测试资产已入库，重新接入时按原步骤执行即可。
