name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Check JavaScript syntax
        run: |
          node -c scripts/utils.js
          node -c scripts/config.js
          node -c scripts/log-setup.js
          node -c scripts/analysis-engine.js
          node -c scripts/full-fetch.js
          node -c scripts/fetch-papers.js
          node -c scripts/fetch-huggingface-papers.js
          node -c scripts/deep-analyzer.js
          node -c scripts/deep-analysis-only.js
          node -c scripts/batch-analyze.js
          node -c scripts/reanalyze.js
          node -c scripts/reanalyze-selected.js
          node -c scripts/refilter-reanalyze-by-date.js
          node -c scripts/analyze-single-paper.js
          node -c scripts/quick-test.js
          node -c scripts/test-api-key.js
          node -c scripts/validate-scores.js
          node -c tests/utils.test.js
          node -c tests/config.test.js
          node -c tests/analysis-engine.test.js
          node -c tests/fetch-huggingface-papers.test.js

      - name: Check Python syntax
        run: |
          PYTHONPYCACHEPREFIX=/tmp/audio-paper-digest-pycache python3 -m py_compile \
            scripts/publish_common.py \
            scripts/utils.py \
            scripts/publish-to-blog.py \
            scripts/publish-wechat-full.py \
            scripts/publish-xiaohongshu.py \
            scripts/publish-to-feishu.py \
            scripts/backfill_papers.py \
            scripts/xiaohongshu-publisher.py \
            scripts/log_setup.py

      - name: Check shell syntax
        run: |
          bash -n scripts/backup-data.sh
