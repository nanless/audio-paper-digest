name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    # 模块加载时会检查正式环境变量。CI 使用无法联网的占位配置，
    # 单元测试模拟请求，不读取仓库或组织的密钥。
    env:
      PAPER_ANALYZER_ENDPOINT: https://example.invalid/v1
      PAPER_ANALYZER_API_KEY: ci-placeholder-not-a-secret
      PAPER_ANALYZER_MODEL: ci-test-model
    strategy:
      matrix:
        node-version: [20.x, 22.x]

    steps:
      - uses: actions/checkout@v4

      - name: 配置 Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: 安装项目依赖
        run: npm ci

      - name: 配置 Python 测试环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装 Python 测试依赖
        run: |
          python3 -m pip install --disable-pip-version-check -r requirements.txt
          bash scripts/python-runtime.sh -m pip check

      - name: 安装中日韩字体
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends fonts-noto-cjk

      - name: 安装固定版本 Hugo 并核验官方校验和
        env:
          HUGO_VERSION: '0.160.1'
        run: |
          set -euo pipefail
          hugo_download_dir="$(mktemp -d)"
          archive="hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"
          release="https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}"
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            "$release/$archive" --output "$hugo_download_dir/$archive"
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            "$release/hugo_${HUGO_VERSION}_checksums.txt" --output "$hugo_download_dir/checksums.txt"
          cd "$hugo_download_dir"
          awk -v archive="$archive" '$2 == archive { print; count++ } END { if (count != 1) exit 1 }' checksums.txt > selected-checksum.txt
          sha256sum --check --strict selected-checksum.txt
          tar -xzf "$archive" hugo
          sudo install -m 0755 hugo /usr/local/bin/hugo
          hugo version

      - name: 创建独立的 CI 环境配置
        run: |
          umask 077
          printf '%s\n' \
            "PAPER_ANALYZER_ENDPOINT=$PAPER_ANALYZER_ENDPOINT" \
            "PAPER_ANALYZER_API_KEY=$PAPER_ANALYZER_API_KEY" \
            "PAPER_ANALYZER_MODEL=$PAPER_ANALYZER_MODEL" \
            "HTTPS_PROXY=http://127.0.0.1:9" > .env

      - name: 运行完整离线验证
        # data/ 不纳入版本控制，因此 CI 显式允许空数据；
        # 单元测试另行构造数据，检查正式文件的格式与对应关系。
        run: npm run verify -- --allow-empty
