name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Setup Python test dependencies
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python test dependencies
        run: python3 -m pip install --disable-pip-version-check -r requirements.txt

      - name: Run tests
        run: npm test

      - name: Validate current data schema
        run: npm run validate:data

      - name: Check JavaScript syntax
        run: |
          find scripts tests -name '*.js' -print0 | while IFS= read -r -d '' file; do
            node -c "$file"
          done

      - name: Check Python syntax
        run: |
          find scripts -name '*.py' -print0 | while IFS= read -r -d '' file; do
            PYTHONPYCACHEPREFIX=/tmp/audio-paper-digest-pycache python3 -m py_compile "$file"
          done

      - name: Run Python tests
        run: |
          python3 -m unittest discover -s tests/python -p 'test_*.py'

      - name: Check shell syntax
        run: |
          find . -name '*.sh' -not -path './node_modules/*' -print0 | while IFS= read -r -d '' file; do
            bash -n "$file"
          done
