name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    # Import-time configuration guards intentionally require the production
    # variable names. CI uses non-routable placeholders; unit tests mock every
    # request and must never depend on repository or organization secrets.
    env:
      PAPER_ANALYZER_ENDPOINT: https://example.invalid/v1
      PAPER_ANALYZER_API_KEY: ci-placeholder-not-a-secret
      PAPER_ANALYZER_MODEL: ci-test-model
    strategy:
      matrix:
        node-version: [20.x, 22.x]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Setup Python test dependencies
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python test dependencies
        run: |
          python3 -m pip install --disable-pip-version-check -r requirements.txt
          bash scripts/python-runtime.sh -m pip check

      - name: Install CJK rendering font
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends fonts-noto-cjk

      - name: Create isolated CI project environment
        run: |
          umask 077
          printf '%s\n' \
            "PAPER_ANALYZER_ENDPOINT=$PAPER_ANALYZER_ENDPOINT" \
            "PAPER_ANALYZER_API_KEY=$PAPER_ANALYZER_API_KEY" \
            "PAPER_ANALYZER_MODEL=$PAPER_ANALYZER_MODEL" \
            "HTTPS_PROXY=http://127.0.0.1:9" > .env

      - name: Run tests
        run: npm test

      - name: Validate current data schema
        # data/ is intentionally gitignored; the empty-checkout mode keeps CI
        # useful while the unit tests exercise representative current files.
        run: npm run validate:data -- --allow-empty

      - name: Check JavaScript syntax
        run: |
          find scripts tests manual/scripts manual/tests -name '*.js' -print0 | while IFS= read -r -d '' file; do
            node -c "$file"
          done

      - name: Check Python syntax
        run: |
          find scripts manual/scripts -name '*.py' -print0 | while IFS= read -r -d '' file; do
            PYTHONPYCACHEPREFIX=/tmp/audio-paper-digest-pycache python3 -m py_compile "$file"
          done

      - name: Run Python tests
        run: |
          bash scripts/python-runtime.sh -m unittest discover -s tests/python -p 'test_*.py'
          bash scripts/python-runtime.sh -m unittest discover -s manual/tests/python -p 'test_*.py'

      - name: Check shell syntax
        run: |
          find . -name '*.sh' -not -path './node_modules/*' -print0 | while IFS= read -r -d '' file; do
            bash -n "$file"
          done
