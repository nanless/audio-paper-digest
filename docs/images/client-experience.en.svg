<svg xmlns="http://www.w3.org/2000/svg" width="960" height="442" viewBox="0 0 960 442" role="img" aria-labelledby="title desc">
  <title id="title">Mac and Android Workbench Reading, Podcast, and Sync Boundaries</title>
  <desc id="desc">Public website snapshots and daily podcast releases flow read-only into the Mac and Android Workbench apps; on the right, three isolated user channels handle personal study models, Zotero archiving (local on Mac, Web API on Android), and versioned WebDAV backups (dashed arrow shows confirmed restore).</desc>
  <defs>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; fill: #0f172a; }
      .t-main { font-size: 20px; font-weight: 700; }
      .t-sub { font-size: 13px; fill: #475569; }
      .t-card { font-size: 14.8px; font-weight: 700; }
      .t-badge { font-size: 11px; font-weight: 700; }
      .t-body { font-size: 12.5px; fill: #334155; }
      .t-small { font-size: 11.4px; fill: #475569; }
      .l-solid { fill: none; stroke: #2563eb; stroke-width: 2; marker-end: url(#a-blue); }
      .l-teal { fill: none; stroke: #0d9488; stroke-width: 2; marker-end: url(#a-teal); }
      .l-dash { fill: none; stroke: #0d9488; stroke-width: 2; stroke-dasharray: 6 4; marker-end: url(#a-teal); }
    </style>
    <marker id="a-blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,1 L7.5,4 L0,7 Z" fill="#2563eb"/>
    </marker>
    <marker id="a-teal" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,1 L7.5,4 L0,7 Z" fill="#0d9488"/>
    </marker>
  </defs>

  <rect width="960" height="442" rx="16" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>

  <text x="32" y="42" class="t-main">Mac &amp; Android Workbench · Public Feed vs. Personal Data Boundaries</text>
  <text x="32" y="64" class="t-sub">Solid arrows: read-only fetch or explicit save  ·  Dashed arrow: user-confirmed restore (never silent merge)</text>

  <rect x="32" y="96" width="224" height="122" rx="12" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.6"/>
  <text x="48" y="124" class="t-card" fill="#1d4ed8">Public Web Portal</text>
  <text x="48" y="149" class="t-body">Static detail snapshots &amp; tags</text>
  <text x="48" y="169" class="t-body">Guides, digests, BibTeX / RIS</text>
  <text x="48" y="196" class="t-small">Read-only; never triggers analysis</text>

  <rect x="32" y="236" width="224" height="114" rx="12" fill="#f0fdfa" stroke="#5eead4" stroke-width="1.6"/>
  <text x="48" y="264" class="t-card" fill="#0f766e">Daily Audio Podcast</text>
  <text x="48" y="289" class="t-body">Verified GitHub Release audio</text>
  <text x="48" y="309" class="t-body">Streaming SHA-256 + MP3 check</text>
  <text x="48" y="334" class="t-small">150 MiB / 5-episode LRU cache</text>

  <path d="M260 157 H306" class="l-solid"/>
  <path d="M260 293 H306" class="l-teal"/>

  <rect x="310" y="96" width="276" height="254" rx="14" fill="#ffffff" stroke="#a78bfa" stroke-width="1.8"/>
  <rect x="310" y="96" width="276" height="44" rx="14" fill="#f5f3ff"/>
  <rect x="310" y="126" width="276" height="14" fill="#f5f3ff"/>
  <text x="328" y="124" class="t-card" fill="#5b21b6">Workbench Apps (v1.5.0)</text>

  <text x="328" y="164" class="t-badge" fill="#4338ca">Mac (Apple Silicon) · Android (4 ABIs)</text>
  <text x="328" y="190" class="t-body">• 400-concept browse &amp; offline search</text>
  <text x="328" y="214" class="t-body">• Reader guide + side-by-side PDF</text>
  <text x="328" y="238" class="t-body">• Favorites by date, highlights, notes</text>
  <text x="328" y="262" class="t-body">• Native podcast (0.75x–2.0x, chapters)</text>
  <text x="328" y="286" class="t-body">• Sanitized HTML5, MathML, and SVG</text>
  <text x="328" y="328" class="t-small">API keys &amp; integrity keys stay local</text>

  <path d="M590 140 H640" class="l-solid"/>
  <path d="M590 223 H640" class="l-solid"/>
  <path d="M590 298 H640" class="l-teal"/>
  <path d="M644 328 H594" class="l-dash"/>

  <rect x="644" y="96" width="284" height="78" rx="11" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="660" y="121" class="t-card">Personal LLM Service (Opt-in)</text>
  <text x="660" y="143" class="t-body">Sends only confirmed extracted text</text>
  <text x="660" y="162" class="t-small">No raw PDF/images; separate billing</text>

  <rect x="644" y="186" width="284" height="78" rx="11" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="660" y="211" class="t-card">Zotero Library Archiving</text>
  <text x="660" y="233" class="t-body">Mac: local API · Android: Web API</text>
  <text x="660" y="252" class="t-small">Authorized independently per device</text>

  <rect x="644" y="276" width="284" height="74" rx="11" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
  <text x="660" y="301" class="t-card" fill="#15803d">WebDAV Versioned Backups</text>
  <text x="660" y="323" class="t-body">Separate folder snapshots; manual restore</text>
  <text x="660" y="341" class="t-small">Secrets and local keys never leave device</text>

  <rect x="32" y="376" width="896" height="44" rx="8" fill="#f1f5f9"/>
  <text x="48" y="396" class="t-small">Privacy &amp; upgrades: Restoring a backup preserves prior notes and history without sending model requests; WebDAV backup and Zotero storage stay separate.</text>
  <text x="48" y="413" class="t-small">v1.5.0 keeps legacy portal-path compatibility for 1.4.x backups. macOS requires macOS 15+ (Apple silicon); Android 1.4.4+ upgrades in place.</text>
</svg>
