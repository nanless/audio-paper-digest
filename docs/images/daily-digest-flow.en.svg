<svg xmlns="http://www.w3.org/2000/svg" width="960" height="464" viewBox="0 0 960 464" role="img" aria-labelledby="title desc">
  <title id="title">Daily Digest End-to-End Pipeline</title>
  <desc id="desc">Studio Monograph six-stage daily pipeline: top row covers boundary fetch and dedup, prefiltering and LLM screening, and four-file source sealing; bottom row covers full analysis and Reader writing, page generation with three-layer review, and remote push, deployment, and live page verification.</desc>
  <defs>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; fill: #182120; }
      .t-main { font-size: 20px; font-weight: 700; }
      .t-sub { font-size: 13px; fill: #4a5755; }
      .t-row { font-size: 12px; font-weight: 700; fill: #556360; letter-spacing: 0.4px; }
      .t-num { font-size: 12px; font-weight: 700; fill: #f7f5f0; }
      .t-card { font-size: 15px; font-weight: 700; }
      .t-body { font-size: 12.6px; fill: #2d3a38; }
      .t-small { font-size: 12px; fill: #556360; }
      .arr { fill: none; stroke: #4a5755; stroke-width: 2; marker-end: url(#a-ink); }
      .arr-down { fill: none; stroke: #0f5c58; stroke-width: 2; stroke-dasharray: 6 4; marker-end: url(#a-teal); }
    </style>
    <marker id="a-ink" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,1 L7.5,4 L0,7 Z" fill="#4a5755"/>
    </marker>
    <marker id="a-teal" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,1 L7.5,4 L0,7 Z" fill="#0f5c58"/>
    </marker>
  </defs>

  <rect width="960" height="464" rx="16" fill="#f7f5f0" stroke="#d6cfc3" stroke-width="1.5"/>

  <text x="32" y="42" class="t-main">How a Daily Digest Moves From arXiv to Live Web Pages</text>
  <text x="32" y="64" class="t-sub">Entry command: npm run digest:prepare -- YYYY-MM-DD (fresh fetch runs only for today's Beijing date)</text>

  <text x="32" y="96" class="t-row">STAGE A · FETCH, SCREEN, AND SEAL SOURCES</text>

  <rect x="32" y="108" width="274" height="106" rx="12" fill="#ffffff" stroke="#b9cfc9" stroke-width="1.5"/>
  <rect x="46" y="122" width="28" height="22" rx="6" fill="#182120"/>
  <text x="60" y="137.5" text-anchor="middle" class="t-num">01</text>
  <text x="82" y="138" class="t-card">Boundary Fetch &amp; Dedup</text>
  <text x="46" y="168" class="t-body">Sync portal; dedup published only</text>
  <text x="46" y="191" class="t-small">Bounded overlap on arXiv + HF</text>

  <path d="M310 161 H338" class="arr"/>

  <rect x="342" y="108" width="276" height="106" rx="12" fill="#ffffff" stroke="#b9cfc9" stroke-width="1.5"/>
  <rect x="356" y="122" width="28" height="22" rx="6" fill="#182120"/>
  <text x="370" y="137.5" text-anchor="middle" class="t-num">02</text>
  <text x="392" y="138" class="t-card">Prefilter &amp; LLM Screen</text>
  <text x="356" y="168" class="t-body">High-recall keywords + LLM triage</text>
  <text x="356" y="191" class="t-small">Saves per-paper reasons &amp; shortlist</text>

  <path d="M622 161 H650" class="arr"/>

  <rect x="654" y="108" width="274" height="106" rx="12" fill="#eef6f4" stroke="#1f8a82" stroke-width="1.6"/>
  <rect x="668" y="122" width="28" height="22" rx="6" fill="#0f5c58"/>
  <text x="682" y="137.5" text-anchor="middle" class="t-num">03</text>
  <text x="704" y="138" class="t-card" fill="#0f5c58">Four-File Source Seal</text>
  <text x="668" y="168" class="t-body">Re-fetch official HTML &amp; PDF bytes</text>
  <text x="668" y="191" class="t-small">Seal txt / pdf / runtime / manifest</text>

  <path d="M791 216 V248 H274 V276" class="arr-down"/>
  <text x="536" y="239" text-anchor="middle" class="t-small" fill="#0f5c58">Sealed bundle locked: analysis, repairs, and cold replay read only these files</text>

  <text x="32" y="268" class="t-row">STAGE B · ANALYZE &amp; PUBLISH</text>

  <rect x="32" y="280" width="274" height="110" rx="12" fill="#ffffff" stroke="#9ec9c3" stroke-width="1.5"/>
  <rect x="46" y="294" width="28" height="22" rx="6" fill="#0f5c58"/>
  <text x="60" y="309.5" text-anchor="middle" class="t-num">04</text>
  <text x="82" y="310" class="t-card">Analysis &amp; Reader Guide</text>
  <text x="46" y="340" class="t-body">13-sec analysis, 8-dim score, tags</text>
  <text x="46" y="363" class="t-small">Tables, TeX, figures &amp; authors verified</text>

  <path d="M310 335 H338" class="arr"/>

  <rect x="342" y="280" width="276" height="110" rx="12" fill="#ffffff" stroke="#9ec9c3" stroke-width="1.5"/>
  <rect x="356" y="294" width="28" height="22" rx="6" fill="#0f5c58"/>
  <text x="370" y="309.5" text-anchor="middle" class="t-num">05</text>
  <text x="392" y="310" class="t-card">Generate &amp; 3-Layer Gate</text>
  <text x="356" y="340" class="t-body">Rules + text/figure audit + Hugo</text>
  <text x="356" y="363" class="t-small">Passed pages cache permanently by SHA</text>

  <path d="M622 335 H650" class="arr"/>

  <rect x="654" y="280" width="274" height="110" rx="12" fill="#fdf6f1" stroke="#b85a34" stroke-width="1.6"/>
  <rect x="668" y="294" width="28" height="22" rx="6" fill="#b85a34"/>
  <text x="682" y="309.5" text-anchor="middle" class="t-num">06</text>
  <text x="704" y="310" class="t-card" fill="#a64d2a">Push, Deploy &amp; Verify</text>
  <text x="668" y="340" class="t-body">Receipt-bound push &amp; remote OID</text>
  <text x="668" y="363" class="t-small">No-visuals record · Pages &amp; HTTP 200</text>

  <rect x="32" y="408" width="896" height="38" rx="8" fill="#ece8de"/>
  <text x="48" y="431.5" class="t-small">Resilience: Failures preserve checkpoints and ledgers so retries run only failed items. Daily posters stay off; original figures remain verified.</text>
</svg>
