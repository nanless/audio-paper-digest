<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="330" viewBox="0 0 1080 330" role="img" aria-labelledby="title desc">
  <title id="title">音频研究工作台 · Audio Research Workbench 全景封面</title>
  <desc id="desc">Studio Monograph 深岩青声谱封面横幅：介绍音频研究工作台的核心定位、Studio Monograph 2.0 公开门户、每日音频播客与 Mac/Android 1.5.x 双端原生客户端，以及四项已核验核心指标。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#111d1c"/>
      <stop offset="52%" stop-color="#162d2b"/>
      <stop offset="100%" stop-color="#132524"/>
    </linearGradient>
    <radialGradient id="glowTeal" cx="76%" cy="38%" r="36%">
      <stop offset="0%" stop-color="#54c4ba" stop-opacity="0.22"/>
      <stop offset="60%" stop-color="#1f8a82" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#111d1c" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowCopper" cx="88%" cy="62%" r="28%">
      <stop offset="0%" stop-color="#e39b6d" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#111d1c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="waveTeal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#54c4ba" stop-opacity="0.08"/>
      <stop offset="48%" stop-color="#54c4ba" stop-opacity="0.78"/>
      <stop offset="100%" stop-color="#e39b6d" stop-opacity="0.22"/>
    </linearGradient>
    <linearGradient id="waveCopper" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#e39b6d" stop-opacity="0.06"/>
      <stop offset="52%" stop-color="#e39b6d" stop-opacity="0.62"/>
      <stop offset="100%" stop-color="#54c4ba" stop-opacity="0.16"/>
    </linearGradient>
    <linearGradient id="accentPill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0f5c58"/>
      <stop offset="100%" stop-color="#1f8a82"/>
    </linearGradient>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Noto Sans CJK SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; }
      .eyebrow { font-size: 12.5px; font-weight: 700; letter-spacing: 1.2px; fill: #e39b6d; }
      .brand-zh { font-size: 42px; font-weight: 800; fill: #f7f5f0; letter-spacing: 0.5px; }
      .brand-en { font-size: 16.5px; font-weight: 600; fill: #a7bab7; letter-spacing: 0.3px; }
      .tagline { font-size: 15.5px; font-weight: 400; fill: #d9e2e0; }
      .stat-num { font-size: 18.5px; font-weight: 800; fill: #f7f5f0; }
      .stat-lbl { font-size: 12px; fill: #a7bab7; }
      .pill-txt { font-size: 12.5px; font-weight: 600; fill: #edf5f3; }
      .badge-txt { font-size: 12px; font-weight: 700; fill: #f7f5f0; }
    </style>
  </defs>

  <rect width="1080" height="330" rx="20" fill="url(#bg)"/>
  <rect width="1080" height="330" rx="20" fill="url(#glowTeal)"/>
  <rect width="1080" height="330" rx="20" fill="url(#glowCopper)"/>
  <rect x="0.75" y="0.75" width="1078.5" height="328.5" rx="19.5" fill="none" stroke="#2c4a47" stroke-width="1.5"/>

  <!-- Acoustic grid lines -->
  <g stroke="#54c4ba" stroke-opacity="0.14" stroke-width="1" stroke-dasharray="3 4">
    <line x1="656" y1="48" x2="1032" y2="48"/>
    <line x1="656" y1="88" x2="1032" y2="88"/>
    <line x1="656" y1="128" x2="1032" y2="128"/>
    <line x1="656" y1="168" x2="1032" y2="168"/>
    <line x1="656" y1="208" x2="1032" y2="208"/>
  </g>

  <!-- Spectrogram bars (Teal + Copper studio motif) -->
  <g transform="translate(692, 128)" opacity="0.92">
    <rect x="0" y="-12" width="7" height="24" rx="3.5" fill="#54c4ba" opacity="0.42"/>
    <rect x="14" y="-24" width="7" height="48" rx="3.5" fill="#54c4ba" opacity="0.58"/>
    <rect x="28" y="-38" width="7" height="76" rx="3.5" fill="#54c4ba" opacity="0.76"/>
    <rect x="42" y="-18" width="7" height="36" rx="3.5" fill="#e39b6d" opacity="0.62"/>
    <rect x="56" y="-50" width="7" height="100" rx="3.5" fill="#54c4ba" opacity="0.88"/>
    <rect x="70" y="-66" width="7" height="132" rx="3.5" fill="#1f8a82"/>
    <rect x="84" y="-34" width="7" height="68" rx="3.5" fill="#e39b6d" opacity="0.82"/>
    <rect x="98" y="-58" width="7" height="116" rx="3.5" fill="#54c4ba" opacity="0.92"/>
    <rect x="112" y="-74" width="7" height="148" rx="3.5" fill="#54c4ba"/>
    <rect x="126" y="-44" width="7" height="88" rx="3.5" fill="#e39b6d" opacity="0.86"/>
    <rect x="140" y="-28" width="7" height="56" rx="3.5" fill="#1f8a82" opacity="0.80"/>
    <rect x="154" y="-60" width="7" height="120" rx="3.5" fill="#54c4ba" opacity="0.94"/>
    <rect x="168" y="-42" width="7" height="84" rx="3.5" fill="#1f8a82" opacity="0.85"/>
    <rect x="182" y="-22" width="7" height="44" rx="3.5" fill="#e39b6d" opacity="0.72"/>
    <rect x="196" y="-48" width="7" height="96" rx="3.5" fill="#54c4ba" opacity="0.86"/>
    <rect x="210" y="-32" width="7" height="64" rx="3.5" fill="#1f8a82" opacity="0.76"/>
    <rect x="224" y="-18" width="7" height="36" rx="3.5" fill="#54c4ba" opacity="0.58"/>
    <rect x="238" y="-38" width="7" height="76" rx="3.5" fill="#e39b6d" opacity="0.74"/>
    <rect x="252" y="-24" width="7" height="48" rx="3.5" fill="#54c4ba" opacity="0.64"/>
    <rect x="266" y="-14" width="7" height="28" rx="3.5" fill="#1f8a82" opacity="0.48"/>
    <rect x="280" y="-20" width="7" height="40" rx="3.5" fill="#54c4ba" opacity="0.44"/>
    <rect x="294" y="-10" width="7" height="20" rx="3.5" fill="#e39b6d" opacity="0.38"/>
  </g>

  <path d="M652 130 C700 76, 742 184, 796 128 C850 72, 896 186, 950 124 C984 86, 1012 142, 1036 128" fill="none" stroke="url(#waveTeal)" stroke-width="2.2"/>
  <path d="M652 134 C704 178, 750 84, 806 134 C862 184, 908 86, 962 138 C994 166, 1018 118, 1036 130" fill="none" stroke="url(#waveCopper)" stroke-width="1.8"/>

  <!-- Eyebrow -->
  <rect x="48" y="36" width="140" height="26" rx="13" fill="url(#accentPill)" stroke="#54c4ba" stroke-opacity="0.4"/>
  <text x="118" y="53.5" text-anchor="middle" class="badge-txt">OPEN SOURCE · v1.5.x</text>
  <text x="202" y="53.5" class="eyebrow">STUDIO MONOGRAPH 2.0 · SPEECH · MUSIC · AUDIO LLM</text>

  <!-- Brand -->
  <text x="48" y="112" class="brand-zh">音频研究工作台</text>
  <text x="366" y="110" class="brand-en">Audio Research Workbench</text>

  <!-- Tagline -->
  <text x="48" y="148" class="tagline">把每天涌现的语音、音乐与声学新论文，变成来源可核验的中文深度精读、</text>
  <text x="48" y="173" class="tagline">Studio Monograph 2.0 公开门户、每日音频播客与 Mac / Android 原生离线工作台。</text>

  <!-- Capability chips -->
  <g transform="translate(48, 196)">
    <rect x="0" y="0" width="150" height="30" rx="8" fill="#173432" stroke="#54c4ba" stroke-opacity="0.5"/>
    <text x="75" y="19.5" text-anchor="middle" class="pill-txt">四文件来源封存</text>

    <rect x="162" y="0" width="154" height="30" rx="8" fill="#173432" stroke="#54c4ba" stroke-opacity="0.5"/>
    <text x="239" y="19.5" text-anchor="middle" class="pill-txt">三层审查后发布</text>

    <rect x="328" y="0" width="186" height="30" rx="8" fill="#2f241d" stroke="#e39b6d" stroke-opacity="0.55"/>
    <text x="421" y="19.5" text-anchor="middle" class="pill-txt">每日播客 · 双端一键同步</text>
  </g>

  <!-- Bottom 4 verified metric cards -->
  <g transform="translate(48, 248)">
    <rect x="0" y="0" width="234" height="58" rx="12" fill="#101a19" fill-opacity="0.82" stroke="#2c4a47"/>
    <text x="16" y="25" class="stat-num">9,400+ 篇中文精读</text>
    <text x="16" y="45" class="stat-lbl">覆盖 8,650+ 篇已核验论文</text>

    <rect x="250" y="0" width="234" height="58" rx="12" fill="#101a19" fill-opacity="0.82" stroke="#2c4a47"/>
    <text x="266" y="25" class="stat-num">400 项 · 9 维度</text>
    <text x="266" y="45" class="stat-lbl">8 大 SOTA 专题与顶会目录</text>

    <rect x="500" y="0" width="234" height="58" rx="12" fill="#101a19" fill-opacity="0.82" stroke="#2c4a47"/>
    <text x="516" y="25" class="stat-num">3 条独立产线</text>
    <text x="516" y="45" class="stat-lbl">日更 · 会议 · 历史三线齐平</text>

    <rect x="750" y="0" width="234" height="58" rx="12" fill="#101a19" fill-opacity="0.82" stroke="#3c342b"/>
    <text x="766" y="25" class="stat-num">Web + Mac + Android</text>
    <text x="766" y="45" class="stat-lbl">v1.5.x 原生离线 · 每日播客</text>
  </g>
</svg>
