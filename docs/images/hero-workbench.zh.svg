<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="330" viewBox="0 0 1080 330" role="img" aria-labelledby="title desc">
  <title id="title">音频研究工作台 · Audio Research Workbench 全景封面</title>
  <desc id="desc">音频研究工作台封面横幅：深海蓝声谱背景，展示核心定位（从 arXiv 与顶会原文到可核验的中文精读、音频研究门户与 macOS/Android 双端工作台），右侧为声波可视化与四项核心能力指标。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1222"/>
      <stop offset="52%" stop-color="#10203a"/>
      <stop offset="100%" stop-color="#0d293b"/>
    </linearGradient>
    <linearGradient id="waveA" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.08"/>
      <stop offset="45%" stop-color="#38bdf8" stop-opacity="0.72"/>
      <stop offset="100%" stop-color="#2dd4bf" stop-opacity="0.16"/>
    </linearGradient>
    <linearGradient id="waveB" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.06"/>
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.62"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.12"/>
    </linearGradient>
    <linearGradient id="accentPill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#0f766e"/>
    </linearGradient>
    <radialGradient id="glow" cx="78%" cy="42%" r="36%">
      <stop offset="0%" stop-color="#2dd4bf" stop-opacity="0.22"/>
      <stop offset="60%" stop-color="#38bdf8" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#0b1222" stop-opacity="0"/>
    </radialGradient>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Noto Sans CJK SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; }
      .eyebrow { font-size: 12.5px; font-weight: 700; letter-spacing: 1.4px; fill: #7dd3fc; }
      .brand-zh { font-size: 44px; font-weight: 800; fill: #f8fafc; letter-spacing: 0.5px; }
      .brand-en { font-size: 17px; font-weight: 600; fill: #94a3b8; letter-spacing: 0.4px; }
      .tagline { font-size: 15.5px; font-weight: 400; fill: #cbd5e1; }
      .stat-num { font-size: 20px; font-weight: 800; fill: #f8fafc; }
      .stat-lbl { font-size: 11.8px; fill: #94a3b8; }
      .pill-txt { font-size: 12.5px; font-weight: 600; fill: #e2e8f0; }
      .badge-txt { font-size: 12px; font-weight: 700; fill: #f0fdfa; }
    </style>
  </defs>

  <!-- Canvas -->
  <rect width="1080" height="330" rx="20" fill="url(#bg)"/>
  <rect width="1080" height="330" rx="20" fill="url(#glow)"/>
  <rect x="0.75" y="0.75" width="1078.5" height="328.5" rx="19.5" fill="none" stroke="#1e3a5f" stroke-width="1.5"/>

  <!-- Subtle acoustic frequency grid on right -->
  <g stroke="#334155" stroke-opacity="0.24" stroke-width="1">
    <line x1="650" y1="48" x2="1032" y2="48"/>
    <line x1="650" y1="88" x2="1032" y2="88"/>
    <line x1="650" y1="128" x2="1032" y2="128"/>
    <line x1="650" y1="168" x2="1032" y2="168"/>
    <line x1="650" y1="208" x2="1032" y2="208"/>
  </g>

  <!-- Precision acoustic waveform bars (right visual motif) -->
  <g transform="translate(692, 128)" opacity="0.92">
    <rect x="0" y="-12" width="7" height="24" rx="3.5" fill="#38bdf8" opacity="0.45"/>
    <rect x="14" y="-24" width="7" height="48" rx="3.5" fill="#38bdf8" opacity="0.60"/>
    <rect x="28" y="-38" width="7" height="76" rx="3.5" fill="#38bdf8" opacity="0.78"/>
    <rect x="42" y="-18" width="7" height="36" rx="3.5" fill="#2dd4bf" opacity="0.62"/>
    <rect x="56" y="-52" width="7" height="104" rx="3.5" fill="#2dd4bf" opacity="0.90"/>
    <rect x="70" y="-66" width="7" height="132" rx="3.5" fill="#38bdf8"/>
    <rect x="84" y="-34" width="7" height="68" rx="3.5" fill="#818cf8" opacity="0.88"/>
    <rect x="98" y="-58" width="7" height="116" rx="3.5" fill="#2dd4bf" opacity="0.95"/>
    <rect x="112" y="-76" width="7" height="152" rx="3.5" fill="#38bdf8"/>
    <rect x="126" y="-46" width="7" height="92" rx="3.5" fill="#818cf8" opacity="0.92"/>
    <rect x="140" y="-28" width="7" height="56" rx="3.5" fill="#2dd4bf" opacity="0.76"/>
    <rect x="154" y="-62" width="7" height="124" rx="3.5" fill="#38bdf8" opacity="0.95"/>
    <rect x="168" y="-44" width="7" height="88" rx="3.5" fill="#2dd4bf" opacity="0.85"/>
    <rect x="182" y="-22" width="7" height="44" rx="3.5" fill="#818cf8" opacity="0.72"/>
    <rect x="196" y="-50" width="7" height="100" rx="3.5" fill="#38bdf8" opacity="0.86"/>
    <rect x="210" y="-32" width="7" height="64" rx="3.5" fill="#2dd4bf" opacity="0.78"/>
    <rect x="224" y="-18" width="7" height="36" rx="3.5" fill="#38bdf8" opacity="0.60"/>
    <rect x="238" y="-40" width="7" height="80" rx="3.5" fill="#818cf8" opacity="0.76"/>
    <rect x="252" y="-26" width="7" height="52" rx="3.5" fill="#2dd4bf" opacity="0.68"/>
    <rect x="266" y="-14" width="7" height="28" rx="3.5" fill="#38bdf8" opacity="0.50"/>
    <rect x="280" y="-20" width="7" height="40" rx="3.5" fill="#2dd4bf" opacity="0.45"/>
    <rect x="294" y="-10" width="7" height="20" rx="3.5" fill="#38bdf8" opacity="0.35"/>
  </g>

  <!-- Continuous harmonic wave overlay -->
  <path d="M648 130 C698 76, 738 184, 792 128 C846 72, 892 186, 948 124 C984 86, 1012 142, 1036 128" fill="none" stroke="url(#waveA)" stroke-width="2.4"/>
  <path d="M648 134 C702 178, 748 84, 804 134 C860 184, 906 86, 962 138 C994 166, 1018 118, 1036 130" fill="none" stroke="url(#waveB)" stroke-width="1.8"/>

  <!-- Top eyebrow + version chip -->
  <rect x="48" y="38" width="128" height="26" rx="13" fill="url(#accentPill)"/>
  <text x="112" y="55" text-anchor="middle" class="badge-txt">OPEN SOURCE · v1.5</text>
  <text x="190" y="55" class="eyebrow">SPEECH · MUSIC · ACOUSTICS · AUDIO LLM</text>

  <!-- Main Brand Title -->
  <text x="48" y="114" class="brand-zh">音频研究工作台</text>
  <text x="380" y="112" class="brand-en">Audio Research Workbench</text>

  <!-- Human-first compelling tagline -->
  <text x="48" y="150" class="tagline">把每天涌现的语音、音乐与声学新论文，变成来源可查的中文深度精读、</text>
  <text x="48" y="175" class="tagline">公开「音频研究门户」与 macOS / Android 双端原生离线研究工作台。</text>

  <!-- Capability chips -->
  <g transform="translate(48, 198)">
    <rect x="0" y="0" width="154" height="30" rx="8" fill="#172554" stroke="#3b82f6" stroke-opacity="0.5"/>
    <text x="77" y="19.5" text-anchor="middle" class="pill-txt">四文件来源封存</text>

    <rect x="166" y="0" width="164" height="30" rx="8" fill="#134e4a" stroke="#2dd4bf" stroke-opacity="0.5"/>
    <text x="248" y="19.5" text-anchor="middle" class="pill-txt">三层审查后才发布</text>

    <rect x="342" y="0" width="180" height="30" rx="8" fill="#1e1b4b" stroke="#818cf8" stroke-opacity="0.5"/>
    <text x="432" y="19.5" text-anchor="middle" class="pill-txt">双端原生 · 播客 · 离线</text>
  </g>

  <!-- Bottom 4 verified metrics strip -->
  <g transform="translate(48, 250)">
    <rect x="0" y="0" width="234" height="54" rx="12" fill="#0f172a" fill-opacity="0.72" stroke="#334155"/>
    <text x="18" y="25" class="stat-num">9,300+ 篇</text>
    <text x="18" y="43" class="stat-lbl">已核验音频论文中文精读归档</text>

    <rect x="250" y="0" width="234" height="54" rx="12" fill="#0f172a" fill-opacity="0.72" stroke="#334155"/>
    <text x="268" y="25" class="stat-num">400 项 · 9 维度</text>
    <text x="268" y="43" class="stat-lbl">语音 / 音乐 / 环境声 / 空间音频谱系</text>

    <rect x="500" y="0" width="234" height="54" rx="12" fill="#0f172a" fill-opacity="0.72" stroke="#334155"/>
    <text x="518" y="25" class="stat-num">3 条独立产线</text>
    <text x="518" y="43" class="stat-lbl">每日追踪 · 顶会专题 · 历史原文重写</text>

    <rect x="750" y="0" width="234" height="54" rx="12" fill="#0f172a" fill-opacity="0.72" stroke="#334155"/>
    <text x="768" y="25" class="stat-num">Web + Mac + Android</text>
    <text x="768" y="43" class="stat-lbl">只读订阅门户 · 个人研究与 Zotero 隔离</text>
  </g>
</svg>
