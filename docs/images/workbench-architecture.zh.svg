<svg xmlns="http://www.w3.org/2000/svg" width="960" height="450" viewBox="0 0 960 450" role="img" aria-labelledby="title desc">
  <title id="title">论文速递工作台三层全景架构</title>
  <desc id="desc">三层结构图：左侧内容生产引擎运行日更、官方会议与历史更新，将通过三层审查的页面推送至中间公开网站；右侧 Mac 与 Android 工作台只读获取网站内容，并提供独立的个人研究、Zotero 与云端备份功能。</desc>
  <defs>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; fill: #0f172a; }
      .t-main { font-size: 21px; font-weight: 700; }
      .t-sub { font-size: 13.5px; fill: #475569; }
      .t-badge { font-size: 11.5px; font-weight: 700; letter-spacing: 0.3px; }
      .t-card { font-size: 15.5px; font-weight: 700; }
      .t-item { font-size: 13px; fill: #334155; }
      .t-small { font-size: 11.8px; fill: #475569; }
      .t-edge { font-size: 12px; font-weight: 700; fill: #1e3a5f; }
      .line-solid { fill: none; stroke: #2563eb; stroke-width: 2.2; marker-end: url(#arr-blue); }
      .line-teal { fill: none; stroke: #0d9488; stroke-width: 2.2; marker-end: url(#arr-teal); }
    </style>
    <marker id="arr-blue" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto">
      <path d="M0,1 L8,4.5 L0,8 Z" fill="#2563eb"/>
    </marker>
    <marker id="arr-teal" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto">
      <path d="M0,1 L8,4.5 L0,8 Z" fill="#0d9488"/>
    </marker>
  </defs>

  <rect width="960" height="450" rx="16" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>

  <text x="32" y="42" class="t-main">论文速递工作台 · 三层结构一览</text>
  <text x="32" y="65" class="t-sub">内容生产、公开网站与个人阅读应用职责分离：打开文章不触发模型重算，个人研究数据与生产账本互不混用</text>

  <!-- Column 1: x=32..288 (w=256) -->
  <rect x="32" y="88" width="256" height="296" rx="14" fill="#ffffff" stroke="#93c5fd" stroke-width="1.8"/>
  <rect x="32" y="88" width="256" height="44" rx="14" fill="#eff6ff"/>
  <rect x="32" y="118" width="256" height="14" fill="#eff6ff"/>
  <text x="46" y="116" class="t-card" fill="#1d4ed8">① 内容生产引擎（本仓库）</text>

  <rect x="46" y="148" width="228" height="64" rx="9" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="58" y="169" class="t-badge" fill="#1e40af">三条流程 · 各自封存来源</text>
  <text x="58" y="189" class="t-item">当天日更 · 官方会议 · 历史更新</text>
  <text x="58" y="205" class="t-small">来源证明与去重基线互不混用</text>

  <rect x="46" y="224" width="228" height="68" rx="9" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="58" y="245" class="t-badge" fill="#1e40af">共享核心 · LLM/API 管线</text>
  <text x="58" y="265" class="t-item">主分析 · 八维评分 · 九维分类</text>
  <text x="58" y="283" class="t-small">初学者长文 Reader + 原图核验</text>

  <rect x="46" y="304" width="228" height="64" rx="9" fill="#f0fdf4" stroke="#86efac" stroke-width="1.2"/>
  <text x="58" y="325" class="t-badge" fill="#15803d">发布门禁 · 三层审查</text>
  <text x="58" y="345" class="t-item">规则 + 正文/原图审查 + Hugo</text>
  <text x="58" y="360" class="t-small">按内容 SHA 复用，精确差异推送</text>

  <!-- Gap 1: x=288..356 (68px) -->
  <path d="M294 236 H348" class="line-solid"/>
  <text x="322" y="222" text-anchor="middle" class="t-edge" fill="#1d4ed8">凭证推送</text>

  <!-- Column 2: x=356..604 (w=248) -->
  <rect x="356" y="88" width="248" height="296" rx="14" fill="#ffffff" stroke="#5eead4" stroke-width="1.8"/>
  <rect x="356" y="88" width="248" height="44" rx="14" fill="#f0fdfa"/>
  <rect x="356" y="118" width="248" height="14" fill="#f0fdfa"/>
  <text x="370" y="116" class="t-card" fill="#0f766e">② 公开网站（Hugo）</text>

  <rect x="370" y="148" width="220" height="68" rx="9" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="382" y="169" class="t-badge" fill="#0f766e">面向读者的中文知识库</text>
  <text x="382" y="189" class="t-item">单篇深度解读与每日汇总</text>
  <text x="382" y="206" class="t-small">浏览器直接阅读与引用导出</text>

  <rect x="370" y="228" width="220" height="68" rx="9" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="382" y="249" class="t-badge" fill="#0f766e">400 项九维音频分类目录</text>
  <text x="382" y="269" class="t-item">语音 · 音乐 · 环境声 · 空间</text>
  <text x="382" y="286" class="t-small">统一标签与主任务/主方法路径</text>

  <rect x="370" y="308" width="220" height="60" rx="9" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="382" y="329" class="t-badge" fill="#0f766e">静态客户端快照与引用</text>
  <text x="382" y="349" class="t-item">client/details/* · Bib · RIS</text>

  <!-- Gap 2: x=604..672 (68px) -->
  <path d="M610 236 H664" class="line-teal"/>
  <text x="638" y="222" text-anchor="middle" class="t-edge" fill="#0f766e">只读同步</text>

  <!-- Column 3: x=672..928 (w=256) -->
  <rect x="672" y="88" width="256" height="296" rx="14" fill="#ffffff" stroke="#c4b5fd" stroke-width="1.8"/>
  <rect x="672" y="88" width="256" height="44" rx="14" fill="#f5f3ff"/>
  <rect x="672" y="118" width="256" height="14" fill="#f5f3ff"/>
  <text x="686" y="116" class="t-card" fill="#5b21b6">③ 阅读工作台（双端）</text>

  <rect x="686" y="148" width="228" height="68" rx="9" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="698" y="169" class="t-badge" fill="#5b21b6">开箱即用 · 无需生产 .env</text>
  <text x="698" y="189" class="t-item">离线检索 · PDF 对照 · 笔记</text>
  <text x="698" y="206" class="t-small">原生每日音频播客（含章节）</text>

  <rect x="686" y="228" width="228" height="68" rx="9" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="698" y="249" class="t-badge" fill="#5b21b6">个人研究 · 主动触发</text>
  <text x="698" y="269" class="t-item">自配模型提问，只发确认文字</text>
  <text x="698" y="286" class="t-small">用量、回答与网站生产隔离</text>

  <rect x="686" y="308" width="228" height="60" rx="9" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="698" y="329" class="t-badge" fill="#5b21b6">文献与备份 · 跨端一致</text>
  <text x="698" y="349" class="t-item">Zotero 归档 · WebDAV 备份</text>

  <rect x="32" y="400" width="896" height="34" rx="8" fill="#f1f5f9"/>
  <text x="48" y="422" class="t-small">说明：仅阅读网页或使用 Mac/Android 应用时不需要配置 API 密钥；箭头方向表示数据流向，不代表各层之间共享凭据或可自动覆写。</text>
</svg>
