<svg xmlns="http://www.w3.org/2000/svg" width="960" height="432" viewBox="0 0 960 432" role="img" aria-labelledby="title desc">
  <title id="title">Audio Research Workbench Three-Layer Architecture</title>
  <desc id="desc">Studio Monograph three-layer architecture: the content engine runs active daily, conference, and historical pipelines at full parity and pushes reviewed diffs to the Studio Monograph 2.0 Hugo portal; Mac and Android v1.5.x apps sync snapshots and podcasts read-only while isolating personal LLM, Zotero, and WebDAV sync.</desc>
  <defs>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; fill: #182120; }
      .t-main { font-size: 20px; font-weight: 700; }
      .t-sub { font-size: 13px; fill: #4a5755; }
      .t-badge { font-size: 12px; font-weight: 700; letter-spacing: 0.2px; }
      .t-card { font-size: 15px; font-weight: 700; fill: #f7f5f0; }
      .t-item { font-size: 12.6px; fill: #263230; }
      .t-small { font-size: 12px; fill: #556360; }
      .t-edge { font-size: 12px; font-weight: 700; }
      .line-teal { fill: none; stroke: #0f5c58; stroke-width: 2.2; marker-end: url(#arr-teal); }
      .line-copper { fill: none; stroke: #b85a34; stroke-width: 2.2; marker-end: url(#arr-copper); }
    </style>
    <marker id="arr-teal" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto">
      <path d="M0,1 L8,4.5 L0,8 Z" fill="#0f5c58"/>
    </marker>
    <marker id="arr-copper" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto">
      <path d="M0,1 L8,4.5 L0,8 Z" fill="#b85a34"/>
    </marker>
  </defs>

  <rect width="960" height="432" rx="16" fill="#f7f5f0" stroke="#d6cfc3" stroke-width="1.5"/>

  <text x="32" y="42" class="t-main">Audio Research Workbench · Three-Layer Architecture</text>
  <text x="32" y="64" class="t-sub">Production, public portal, and native clients stay isolated: opening papers never re-runs analysis or shares secrets</text>

  <!-- Column 1 -->
  <rect x="32" y="88" width="256" height="282" rx="14" fill="#ffffff" stroke="#b9cfc9" stroke-width="1.6"/>
  <rect x="32" y="88" width="256" height="44" rx="14" fill="#182120"/>
  <rect x="32" y="118" width="256" height="14" fill="#182120"/>
  <text x="48" y="115" class="t-card">1. Content Engine (Repo)</text>

  <rect x="46" y="146" width="228" height="62" rx="9" fill="#f7f5f0" stroke="#ddd6ca" stroke-width="1.2"/>
  <text x="58" y="168" class="t-badge" fill="#0f5c58">Three Isolated Pipelines</text>
  <text x="58" y="191" class="t-item">Daily · Conference · History</text>

  <rect x="46" y="218" width="228" height="62" rx="9" fill="#f7f5f0" stroke="#ddd6ca" stroke-width="1.2"/>
  <text x="58" y="240" class="t-badge" fill="#0f5c58">Shared LLM/API Core</text>
  <text x="58" y="263" class="t-item">4-file seal · tiered effort · Reader</text>

  <rect x="46" y="290" width="228" height="64" rx="9" fill="#eef6f4" stroke="#9ec9c3" stroke-width="1.2"/>
  <text x="58" y="312" class="t-badge" fill="#0f5c58">3-Layer Review Gate</text>
  <text x="58" y="336" class="t-item">Rules + Text/Figure + Hugo build</text>

  <!-- Gap 1 -->
  <path d="M294 228 H348" class="line-teal"/>
  <text x="321" y="214" text-anchor="middle" class="t-edge" fill="#0f5c58">Push</text>

  <!-- Column 2 -->
  <rect x="356" y="88" width="248" height="282" rx="14" fill="#ffffff" stroke="#9ec9c3" stroke-width="1.6"/>
  <rect x="356" y="88" width="248" height="44" rx="14" fill="#0f5c58"/>
  <rect x="356" y="118" width="248" height="14" fill="#0f5c58"/>
  <text x="372" y="115" class="t-card">2. Audio Research Portal</text>

  <rect x="370" y="146" width="220" height="62" rx="9" fill="#f7f5f0" stroke="#ddd6ca" stroke-width="1.2"/>
  <text x="382" y="168" class="t-badge" fill="#0f5c58">Studio Monograph 2.0</text>
  <text x="382" y="191" class="t-item">9,300+ guides (8,650+ papers)</text>

  <rect x="370" y="218" width="220" height="62" rx="9" fill="#f7f5f0" stroke="#ddd6ca" stroke-width="1.2"/>
  <text x="382" y="240" class="t-badge" fill="#0f5c58">400-Concept Taxonomy</text>
  <text x="382" y="263" class="t-item">8 SOTA hubs · ⌘K search</text>

  <rect x="370" y="290" width="220" height="64" rx="9" fill="#f7f5f0" stroke="#ddd6ca" stroke-width="1.2"/>
  <text x="382" y="312" class="t-badge" fill="#0f5c58">Static Snapshots &amp; Feeds</text>
  <text x="382" y="336" class="t-item">client/details/* · podcast feed</text>

  <!-- Gap 2 -->
  <path d="M610 228 H664" class="line-copper"/>
  <text x="637" y="214" text-anchor="middle" class="t-edge" fill="#b85a34">Read-only</text>

  <!-- Column 3 -->
  <rect x="672" y="88" width="256" height="282" rx="14" fill="#ffffff" stroke="#e4bfa8" stroke-width="1.6"/>
  <rect x="672" y="88" width="256" height="44" rx="14" fill="#b85a34"/>
  <rect x="672" y="118" width="256" height="14" fill="#b85a34"/>
  <text x="688" y="115" class="t-card">3. Native Apps (v1.5.x)</text>

  <rect x="686" y="146" width="228" height="62" rx="9" fill="#fdf8f4" stroke="#ead6c9" stroke-width="1.2"/>
  <text x="698" y="168" class="t-badge" fill="#a64d2a">Zero-Config Reading</text>
  <text x="698" y="191" class="t-item">Offline search · PDF · Notes</text>

  <rect x="686" y="218" width="228" height="62" rx="9" fill="#fdf8f4" stroke="#ead6c9" stroke-width="1.2"/>
  <text x="698" y="240" class="t-badge" fill="#a64d2a">Daily Audio Podcast</text>
  <text x="698" y="263" class="t-item">Chapters · SHA-verified cache</text>

  <rect x="686" y="290" width="228" height="64" rx="9" fill="#fdf8f4" stroke="#ead6c9" stroke-width="1.2"/>
  <text x="698" y="312" class="t-badge" fill="#a64d2a">Isolated User Channels</text>
  <text x="698" y="336" class="t-item">Own LLM · Zotero · WebDAV sync</text>

  <rect x="32" y="384" width="896" height="32" rx="8" fill="#ece8de"/>
  <text x="48" y="405" class="t-small">Note: Browsing the portal or using the Mac/Android apps never requires a production .env. Arrows show data flow, not shared credentials.</text>
</svg>
