<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1265" viewBox="0 0 640 1265" role="img" aria-labelledby="title description"><title id="title">公开阅读与个人研究资料</title><desc id="description">网站公开内容只读进入Mac和Android工作台。工作台按用户主动操作发送选定文字给模型，Mac和Android各走各自Zotero接口；研究备份独立保存版本，虚线表示确认后恢复，不自动合并，不迁移凭据或本机校验密钥。</desc>
<defs><style>text{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans CJK SC",Arial,sans-serif;fill:#183247}.title{font-size:26px;font-weight:700}.head{font-size:23px;font-weight:650}.body{font-size:20px}.note{font-size:18px;fill:#425b70}.bus{fill:none;stroke:#59778e;stroke-width:2.5}.line{fill:none;stroke:#59778e;stroke-width:2.5;marker-end:url(#arrow)}.return{fill:none;stroke:#2d776c;stroke-width:2.5;stroke-dasharray:8 6;marker-end:url(#returnarrow)}</style><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#59778e"/></marker><marker id="returnarrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#2d776c"/></marker></defs>
<rect width="640" height="1265" rx="18" fill="#f5f8fb"/>
<text x="32" y="48" class="title">公开阅读与个人研究资料</text>
<text x="32" y="82" class="note">实线：读取或主动保存　虚线：确认后恢复</text>
<rect x="32" y="108" width="576" height="122" rx="14" fill="#eaf1fc" stroke="#b9cbd8" stroke-width="1.5"/>
<text x="54" y="144" class="head">网站已经发布的内容</text>
<text x="54" y="180" class="body">目录、论文解读、汇总、引用与 PDF 来源</text>
<text x="54" y="209" class="body">打开内容不会重新运行生产分析</text>
<path d="M320 234V281" class="line"/>
<text x="340" y="263" class="note">只读获取</text>
<rect x="32" y="288" width="576" height="168" rx="14" fill="#fff" stroke="#b9cbd8" stroke-width="1.5"/>
<text x="54" y="324" class="head">Mac 与 Android 工作台</text>
<text x="54" y="360" class="body">阅读、原文对照、收藏、笔记与个人研究</text>
<text x="54" y="389" class="body">个人资料、模型配置与网站生产任务分开</text>
<path d="M320 460V478H600V1039" class="bus"/>
<rect x="48" y="500" width="512" height="122" rx="14" fill="#fff" stroke="#b9cbd8" stroke-width="1.5"/>
<text x="70" y="536" class="head">用户配置的模型服务</text>
<text x="70" y="572" class="body">仅主动研究或测试连接时调用</text>
<text x="70" y="601" class="body">研究只发确认的提取文字，不发 PDF 或图片</text>
<path d="M600 561H564" class="line"/>
<rect x="48" y="654" width="512" height="122" rx="14" fill="#fff" stroke="#b9cbd8" stroke-width="1.5"/>
<text x="70" y="690" class="head">仅 Mac：本机 Zotero</text>
<text x="70" y="726" class="body">使用该设备单独授予的本地接口许可</text>
<text x="70" y="755" class="body">书目、附件与资料按实际归档结果核验</text>
<path d="M600 715H564" class="line"/>
<rect x="48" y="808" width="512" height="122" rx="14" fill="#fff" stroke="#b9cbd8" stroke-width="1.5"/>
<text x="70" y="844" class="head">仅 Android：Zotero Web API</text>
<text x="70" y="880" class="body">单独配置官方接口授权</text>
<text x="70" y="909" class="body">不继承 Mac 的本地许可</text>
<path d="M600 869H564" class="line"/>
<rect x="48" y="962" width="512" height="154" rx="14" fill="#edf6f2" stroke="#b9cbd8" stroke-width="1.5"/>
<text x="70" y="998" class="head">两端：完整研究资料备份</text>
<text x="70" y="1034" class="body">独立目录保存版本，恢复前确认</text>
<text x="70" y="1063" class="body">不自动合并两台设备的并行编辑</text>
<text x="70" y="1092" class="body">与 Zotero 附件同步的目录及授权分开</text>
<path d="M600 1039H564" class="line"/>
<path d="M48 1039H16V355H28" class="return"/>
<text x="32" y="1160" class="note">模型密钥、登录凭据、本机完整性校验密钥</text>
<text x="32" y="1189" class="note">不随研究备份迁移；恢复不会自动重发请求。</text>
<text x="32" y="1218" class="note">本图解释数据关系，实际验证范围另见使用说明。</text>
</svg>
