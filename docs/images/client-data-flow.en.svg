<svg xmlns="http://www.w3.org/2000/svg" width="680" height="1272" viewBox="0 0 680 1272" role="img" aria-labelledby="title desc">
  <title id="title">Published Reading, Daily Podcasts, and Personal Research Data Flow</title>
  <desc id="desc">Published portal snapshots and v1.5.0 daily audio podcasts flow read-only into Mac and Android Workbench apps; isolated channels handle opt-in personal LLM study, per-device Zotero archiving, one-click bidirectional WebDAV sync with lossless note conflict merge, and full-space versioned snapshot backups with confirmed restore.</desc>
  <defs>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; fill: #182120; }
      .title { font-size: 22px; font-weight: 700; }
      .head { font-size: 18px; font-weight: 700; }
      .head-inv { font-size: 18px; font-weight: 700; fill: #f7f5f0; }
      .body { font-size: 15px; fill: #2d3a38; }
      .note { font-size: 13.5px; fill: #556360; }
      .bus { fill: none; stroke: #4a5755; stroke-width: 2.2; }
      .line { fill: none; stroke: #0f5c58; stroke-width: 2.2; marker-end: url(#arrow); }
      .bi { fill: none; stroke: #1f8a82; stroke-width: 2.4; marker-start: url(#arrow-rev); marker-end: url(#arrow); }
      .copper { fill: none; stroke: #b85a34; stroke-width: 2.2; marker-end: url(#arrow-copper); }
      .return { fill: none; stroke: #b85a34; stroke-width: 2.2; stroke-dasharray: 8 5; marker-end: url(#arrow-copper); }
    </style>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,1 L8,4.5 L0,8 Z" fill="#0f5c58"/></marker>
    <marker id="arrow-rev" markerWidth="9" markerHeight="9" refX="1.5" refY="4.5" orient="auto"><path d="M8,1 L0,4.5 L8,8 Z" fill="#1f8a82"/></marker>
    <marker id="arrow-copper" markerWidth="9" markerHeight="9" refX="7.5" refY="4.5" orient="auto"><path d="M0,1 L8,4.5 L0,8 Z" fill="#b85a34"/></marker>
  </defs>

  <rect width="680" height="1272" rx="18" fill="#f7f5f0" stroke="#d6cfc3" stroke-width="1.5"/>
  <text x="36" y="48" class="title">Public Reading, Podcasts &amp; Personal Data Flow</text>
  <text x="36" y="76" class="note">Solid: read/save · Two-way: one-click sync · Dashed: confirmed restore</text>

  <rect x="36" y="102" width="328" height="120" rx="14" fill="#eef6f4" stroke="#9ec9c3" stroke-width="1.5"/>
  <text x="56" y="136" class="head" fill="#0f5c58">Audio Research Portal</text>
  <text x="56" y="168" class="body">Snapshots, guides, digests, citations</text>
  <text x="56" y="196" class="note">Read-only; never re-runs production</text>

  <rect x="380" y="102" width="264" height="120" rx="14" fill="#fdf6f1" stroke="#e4bfa8" stroke-width="1.5"/>
  <text x="400" y="136" class="head" fill="#a64d2a">Daily Podcast (1.5.0)</text>
  <text x="400" y="168" class="body">Verified Release HTTPS MP3</text>
  <text x="400" y="196" class="note">150 MiB / 5-ep LRU; no backup</text>

  <path d="M200 226 V272" class="line"/>
  <text x="216" y="255" class="note">Read-only</text>
  <path d="M512 226 V272" class="copper"/>
  <text x="528" y="255" class="note">Verified cache</text>

  <rect x="36" y="280" width="608" height="132" rx="14" fill="#ffffff" stroke="#b9cfc9" stroke-width="1.8"/>
  <rect x="36" y="280" width="608" height="44" rx="14" fill="#182120"/>
  <rect x="36" y="310" width="608" height="14" fill="#182120"/>
  <text x="56" y="309" class="head-inv">Mac &amp; Android Audio Research Workbench (v1.5.0)</text>
  <text x="56" y="356" class="body">Guides, side-by-side PDFs, favorites, notes, podcasts &amp; study</text>
  <text x="56" y="388" class="note">Personal data &amp; model settings stay isolated from production</text>

  <path d="M340 416 V438 H644 V1092" class="bus"/>

  <rect x="64" y="460" width="524" height="114" rx="14" fill="#ffffff" stroke="#d6cfc3" stroke-width="1.5"/>
  <text x="86" y="494" class="head">User-Configured Personal LLM</text>
  <text x="86" y="524" class="body">Called only on explicit study or connection test</text>
  <text x="86" y="552" class="note">Sends approved extracted text only; never raw PDFs or images</text>
  <path d="M644 517 H592" class="line"/>

  <rect x="64" y="596" width="524" height="114" rx="14" fill="#ffffff" stroke="#d6cfc3" stroke-width="1.5"/>
  <text x="86" y="630" class="head">Mac Only: Local Zotero API</text>
  <text x="86" y="660" class="body">Uses local authorization granted on that Mac</text>
  <text x="86" y="688" class="note">Reads back bibliography, PDF, guide, and notes item by item</text>
  <path d="M644 653 H592" class="line"/>

  <rect x="64" y="732" width="524" height="114" rx="14" fill="#ffffff" stroke="#d6cfc3" stroke-width="1.5"/>
  <text x="86" y="766" class="head">Android Only: Zotero Web API v3</text>
  <text x="86" y="796" class="body">Independent official authorization; never inherits Mac grant</text>
  <text x="86" y="824" class="note">Supports Zotero Storage or a separate WebDAV attachment folder</text>
  <path d="M644 789 H592" class="line"/>

  <rect x="64" y="868" width="524" height="126" rx="14" fill="#eef6f4" stroke="#1f8a82" stroke-width="1.6"/>
  <text x="86" y="902" class="head" fill="#0f5c58">Both: One-Click Bidirectional WebDAV Sync</text>
  <text x="86" y="932" class="body">Syncs favorites, notes, reading state, PDFs &amp; offline guides</text>
  <text x="86" y="960" class="note">Concurrent note edits show a lossless merge card &amp; archive copies</text>
  <path d="M640 931 H594" class="bi"/>

  <rect x="64" y="1016" width="524" height="136" rx="14" fill="#fdf6f1" stroke="#b85a34" stroke-width="1.6"/>
  <text x="86" y="1050" class="head" fill="#a64d2a">Both: Full-Space Snapshot Backups</text>
  <text x="86" y="1080" class="body">Independent UUID snapshot folders never overwrite each other</text>
  <text x="86" y="1108" class="body">Explicit user confirmation keeps a pre-restore safety copy</text>
  <text x="86" y="1134" class="note">Separate from Zotero attachments and podcast LRU cache</text>
  <path d="M644 1092 H592" class="copper"/>
  <path d="M64 1092 H20 V346 H32" class="return"/>

  <rect x="36" y="1174" width="608" height="72" rx="10" fill="#ece8de"/>
  <text x="54" y="1202" class="note">API keys, login passwords, and local integrity keys never leave the device;</text>
  <text x="54" y="1228" class="note">restoring never resends LLM requests. See app guides for tested scope.</text>
</svg>
