    <rect x="56" y="-52" width="7" height="104" rx="3.5" fill="#2dd4bf" opacity="0.90"/>
    <rect x="70" y="-66" width="7" height="132" rx="3.5" fill="#38bdf8"/>
    <rect x="84" y="-34" width="7" height="68" rx="3.5" fill="#818cf8" opacity="0.88"/>
    <rect x="98" y="-58" width="7" height="116" rx="3.5" fill="#2dd4bf" opacity="0.95"/>
    <rect x="112" y="-76" width="7" height="152" rx="3.5" fill="#38bdf8"/>
    <rect x="126" y="-46" width="7" height="92" rx="3.5" fill="#818cf8" opacity="0.92"/>
    <rect x="140" y="-28" width="7" height="56" rx="3.5" fill="#2dd4bf" opacity="0.76"/>
    <rect x="154" y="-62" width="7" height="124" rx="3.5" fill="#38bdf8" opacity="0.95"/>
    <rect x="168" y="-44" width="7" height="88" rx="3.5" fill="#2dd4bf" opacity="0.85"/>
    <rect x="182" y="-22" width="7" height="44" rx="3.5" fill="#818cf8" opacity="0.72"/>
    <rect x="196" y="-50" width="7" height="100" rx="3.5" fill="#38bdf8" opacity="0.86"/>
    <rect x="210" y="-32" width="7" height="64" rx="3.5" fill="#2dd4bf" opacity="0.78"/>
    <rect x="224" y="-18" width="7" height="36" rx="3.5" fill="#38bdf8" opacity="0.60"/>
    <rect x="238" y="-40" width="7" height="80" rx="3.5" fill="#818cf8" opacity="0.76"/>
    <rect x="252" y="-26" width="7" height="52" rx="3.5" fill="#2dd4bf" opacity="0.68"/>
    <rect x="266" y="-14" width="7" height="28" rx="3.5" fill="#38bdf8" opacity="0.50"/>
    <rect x="280" y="-20" width="7" height="40" rx="3.5" fill="#2dd4bf" opacity="0.45"/>
    <rect x="294" y="-10" width="7" height="20" rx="3.5" fill="#38bdf8" opacity="0.35"/>
  </g>

  <path d="M656 130 C704 76, 744 184, 796 128 C848 72, 896 186, 950 124 C986 86, 1012 142, 1036 128" fill="none" stroke="url(#waveA)" stroke-width="2.4"/>
  <path d="M656 134 C708 178, 754 84, 808 134 C862 184, 910 86, 964 138 C996 166, 1018 118, 1036 130" fill="none" stroke="url(#waveB)" stroke-width="1.8"/>

  <rect x="48" y="38" width="132" height="26" rx="13" fill="url(#accentPill)"/>
  <text x="114" y="55" text-anchor="middle" class="badge-txt">OPEN SOURCE · v1.5</text>
  <text x="194" y="55" class="eyebrow">SPEECH · MUSIC · ACOUSTICS · AUDIO LLM</text>

  <text x="48" y="110" class="brand-en">Audio Research Workbench</text>

  <text x="48" y="146" class="tagline">Turn daily arXiv and top-venue audio papers into source-verified Chinese deep-dives,</text>
  <text x="48" y="170" class="tagline">a public Audio Research Portal, and native macOS &amp; Android offline research apps.</text>

  <g transform="translate(48, 196)">
    <rect x="0" y="0" width="166" height="30" rx="8" fill="#172554" stroke="#3b82f6" stroke-opacity="0.5"/>
    <text x="83" y="19.5" text-anchor="middle" class="pill-txt">4-File Source Seal</text>

    <rect x="178" y="0" width="176" height="30" rx="8" fill="#134e4a" stroke="#2dd4bf" stroke-opacity="0.5"/>
    <text x="266" y="19.5" text-anchor="middle" class="pill-txt">3-Layer Review Gate</text>

    <rect x="366" y="0" width="214" height="30" rx="8" fill="#1e1b4b" stroke="#818cf8" stroke-opacity="0.5"/>
    <text x="473" y="19.5" text-anchor="middle" class="pill-txt">Mac &amp; Android · Podcast · Offline</text>
  </g>

  <g transform="translate(48, 250)">
    <rect x="0" y="0" width="234" height="54" rx="12" fill="#0f172a" fill-opacity="0.72" stroke="#334155"/>
    <text x="18" y="24" class="stat-num">9,300+ Papers</text>
    <text x="18" y="42" class="stat-lbl">Verified Chinese guides published live</text>

    <rect x="250" y="0" width="234" height="54" rx="12" fill="#0f172a" fill-opacity="0.72" stroke="#334155"/>
    <text x="268" y="24" class="stat-num">400 Concepts · 9D</text>
    <text x="268" y="42" class="stat-lbl">Speech, music, sound &amp; spatial map</text>

    <rect x="500" y="0" width="234" height="54" rx="12" fill="#0f172a" fill-opacity="0.72" stroke="#334155"/>
    <text x="518" y="24" class="stat-num">3 Isolated Pipelines</text>
    <text x="518" y="42" class="stat-lbl">Daily · Conference · Historical rewrite</text>

    <rect x="750" y="0" width="234" height="54" rx="12" fill="#0f172a" fill-opacity="0.72" stroke="#334155"/>
    <text x="768" y="24" class="stat-num">Web · Mac · Android</text>
    <text x="768" y="42" class="stat-lbl">Read-only portal · local LLM &amp; Zotero</text>
  </g>
</svg>
