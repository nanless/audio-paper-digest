<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="330" viewBox="0 0 1080 330" role="img" aria-labelledby="title desc">
  <title id="title">Audio Research Workbench · Overview Banner</title>
  <desc id="desc">Hero banner for Audio Research Workbench: deep navy acoustic waveform motif introducing source-grounded audio research analysis, the public Audio Research Portal, and native macOS and Android workbenches with four verified highlight cards.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1222"/>
      <stop offset="52%" stop-color="#10203a"/>
      <stop offset="100%" stop-color="#0d293b"/>
    </linearGradient>
    <linearGradient id="waveA" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.08"/>
      <stop offset="45%" stop-color="#38bdf8" stop-opacity="0.72"/>
      <stop offset="100%" stop-color="#2dd4bf" stop-opacity="0.16"/>
    </linearGradient>
    <linearGradient id="waveB" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.06"/>
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.62"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.12"/>
    </linearGradient>
    <linearGradient id="accentPill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#0f766e"/>
    </linearGradient>
    <radialGradient id="glow" cx="78%" cy="42%" r="36%">
      <stop offset="0%" stop-color="#2dd4bf" stop-opacity="0.22"/>
      <stop offset="60%" stop-color="#38bdf8" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#0b1222" stop-opacity="0"/>
    </radialGradient>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      .eyebrow { font-size: 12px; font-weight: 700; letter-spacing: 1.4px; fill: #7dd3fc; }
      .brand-en { font-size: 38px; font-weight: 800; fill: #f8fafc; letter-spacing: -0.4px; }
      .brand-sub { font-size: 16px; font-weight: 600; fill: #94a3b8; }
      .tagline { font-size: 15px; font-weight: 400; fill: #cbd5e1; }
      .stat-num { font-size: 18.5px; font-weight: 800; fill: #f8fafc; }
      .stat-lbl { font-size: 11.4px; fill: #94a3b8; }
      .pill-txt { font-size: 12px; font-weight: 600; fill: #e2e8f0; }
      .badge-txt { font-size: 11.5px; font-weight: 700; fill: #f0fdfa; }
    </style>
  </defs>

  <rect width="1080" height="330" rx="20" fill="url(#bg)"/>
  <rect width="1080" height="330" rx="20" fill="url(#glow)"/>
  <rect x="0.75" y="0.75" width="1078.5" height="328.5" rx="19.5" fill="none" stroke="#1e3a5f" stroke-width="1.5"/>

  <g stroke="#334155" stroke-opacity="0.24" stroke-width="1">
    <line x1="658" y1="48" x2="1032" y2="48"/>
    <line x1="658" y1="88" x2="1032" y2="88"/>
    <line x1="658" y1="128" x2="1032" y2="128"/>
    <line x1="658" y1="168" x2="1032" y2="168"/>
    <line x1="658" y1="208" x2="1032" y2="208"/>
  </g>

  <g transform="translate(700, 128)" opacity="0.92">
    <rect x="0" y="-12" width="7" height="24" rx="3.5" fill="#38bdf8" opacity="0.45"/>
    <rect x="14" y="-24" width="7" height="48" rx="3.5" fill="#38bdf8" opacity="0.60"/>
    <rect x="28" y="-38" width="7" height="76" rx="3.5" fill="#38bdf8" opacity="0.78"/>
