<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="330" viewBox="0 0 1080 330" role="img" aria-labelledby="title desc">
  <title id="title">Audio Research Workbench · Overview Banner</title>
  <desc id="desc">Studio Monograph dark slate acoustic hero banner introducing Audio Research Workbench: 9,300+ Chinese paper guides across 8,650+ verified audio papers, Studio Monograph 2.0 portal, daily audio podcast, and native macOS and Android v1.5.x clients.</desc>
  <defs>
