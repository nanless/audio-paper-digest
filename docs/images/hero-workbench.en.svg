      <stop offset="52%" stop-color="#e39b6d" stop-opacity="0.62"/>
      <stop offset="100%" stop-color="#54c4ba" stop-opacity="0.16"/>
    </linearGradient>
    <linearGradient id="accentPill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0f5c58"/>
      <stop offset="100%" stop-color="#1f8a82"/>
    </linearGradient>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      .eyebrow { font-size: 12px; font-weight: 700; letter-spacing: 1.1px; fill: #e39b6d; }
      .brand-en { font-size: 38px; font-weight: 800; fill: #f7f5f0; letter-spacing: -0.4px; }
      .tagline { font-size: 15px; font-weight: 400; fill: #d9e2e0; }
      .stat-num { font-size: 18px; font-weight: 800; fill: #f7f5f0; }
      .stat-lbl { font-size: 12px; fill: #a7bab7; }
      .pill-txt { font-size: 12.2px; font-weight: 600; fill: #edf5f3; }
      .badge-txt { font-size: 12px; font-weight: 700; fill: #f7f5f0; }
